## configs/model_config.yaml

# WARDEN-T model, training and forecasting configuration.
# These values are consumed by src/models/*.py and src/forecasting/*.py.

model:
  input_dim: 87          # features per network state S_t (81 - 1 leakage + 7 packet-level)
  output_dim: 87         # predicted S(t+1)
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1
  sequence_length: 10    # S(t-9) ... S(t)
  max_len: 64            # rollout safety limit on sequence length
  pooling: "last"        # "last" = encode S(t); "mean" = average over window

training:
  batch_size: 32
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 7            # early stopping on validation total loss
  grad_clip: 1.0
  lambda_state: 1.0
  lambda_risk: 1.0
  lambda_category: 1.0
  huber_beta: 1.0        # SmoothL1 transition point
  class_weight_mode: "inverse_frequency"
  feature_clip: 10.0     # robust-scaling clip bound in normalised units
  risk_pos_weight: true  # selected on validation: val loss 1.68/AUC 0.508 vs 2.13/0.396 without

forecasting:
  horizon: 5             # recursive rollout steps K

paths:
  processed_dir: "data/processed"
  models_dir: "models"
